version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8008:8008"
    volumes:
      - ./data:/app/data
      - fraudshield_db:/app/db
    environment:
      - ENV=production
      - PORT=8008
      # Set a specific comma-separated list of allowed frontend origins
      - ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      # REQUIRED: set via .env file or shell export — never hardcode here
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
    env_file:
      - .env

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8008
    ports:
      - "3000:80"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:8008

volumes:
  fraudshield_db:
