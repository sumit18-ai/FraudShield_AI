services:
  - type: web
    name: fraudshield-backend
    env: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    region: oregon
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8008
      - key: ENV
        value: production
      - key: ALLOWED_ORIGINS
        # Set this to your actual Render/Vercel frontend URL after deployment
        value: "https://fraudshield-frontend.onrender.com,https://fraudshield-ai.vercel.app"
      - key: JWT_SECRET_KEY
        # Render auto-generates a cryptographically secure random value
        generateValue: true

  - type: web
    name: fraudshield-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        # Set this to the public URL of your fraudshield-backend web service
        value: https://fraudshield-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
